[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
# The version IS the release switch (release.yml): merging a bump to main publishes it.
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
cswap-core = { path = "crates/core" }
cswap-driver = { path = "crates/driver" }
cswap-ui = { path = "crates/ui" }
cswap-update = { path = "crates/update" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
eframe = { version = "0.37", default-features = false }
egui = "0.37"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
