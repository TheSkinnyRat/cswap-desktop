name: macOS launch check

# Nobody on the team owns a Mac, so this is the only place the .dmg is ever opened. It
# checks what Gatekeeper checks (the code signature) on both the published release and a
# fresh build of this commit, and starts the app to see whether it keeps running. It
# cannot click Gatekeeper's dialog. The fresh build is also checked for the Dock setting
# (what macOS says the app is) and uploaded, so a Mac tester can try a pull request.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to check (empty = latest)
        required: false
  pull_request:
    paths:
      - packaging/macos/**
      - apps/cswap-desktop/**
      - .github/workflows/mac-check.yml

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.source }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
        source: [release, build]
    steps:
      - uses: actions/checkout@v5

      - name: Download the published .dmg
        if: matrix.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern "claude-swap-desktop-mac-$arch.dmg" --dir dmg
          ls -l dmg

      - name: Build the .dmg from this commit
        if: matrix.source == 'build'
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          packaging/macos/build.sh --arch "$arch"
          mkdir dmg && cp packaging/macos/out/*.dmg dmg/

      - name: Upload the .dmg for testers
        if: matrix.source == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: claude-swap-desktop-mac-${{ runner.arch }}
          path: dmg/*.dmg
          retention-days: 7

      - name: Install the way a browser download would
        run: |
          dmg=$(ls dmg/*.dmg)
          # Browsers tag downloads with this attribute; it is what makes Gatekeeper look
          # at the app at all.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$dmg"
          hdiutil attach -nobrowse -mountpoint /tmp/dmg "$dmg"
          ditto /tmp/dmg/"Claude Swap.app" "$RUNNER_TEMP/Claude Swap.app"
          hdiutil detach /tmp/dmg
          xattr -p com.apple.quarantine "$RUNNER_TEMP/Claude Swap.app" \
            || xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/Claude Swap.app"

      - name: Signature (an invalid one is what macOS reports as "damaged")
        id: sig
        run: |
          app="$RUNNER_TEMP/Claude Swap.app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|flags' || true
          if codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "valid=yes" >> "$GITHUB_OUTPUT"
          else
            echo "valid=no" >> "$GITHUB_OUTPUT"
          fi
          echo "--- Gatekeeper (an ad-hoc signature is rejected here too; that is the 'Open Anyway' case)"
          spctl --assess --type execute --verbose=4 "$app" || true

      - name: Launch
        id: launch
        run: |
          app="$RUNNER_TEMP/Claude Swap.app"
          xattr -dr com.apple.quarantine "$app"
          export CSWAP_DESKTOP_USERDATA="$RUNNER_TEMP/userdata"
          set +e
          "$app/Contents/MacOS/Claude Swap" > launch.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then
            echo "running=yes" >> "$GITHUB_OUTPUT"
            kill $pid
          else
            wait $pid; echo "exit=$?"
            echo "running=no" >> "$GITHUB_OUTPUT"
          fi
          tail -20 launch.log

      # The Dock setting, as macOS sees it: `lsappinfo` reports a Regular app (Dock icon,
      # Cmd+Tab) as Foreground and an Accessory one (menu bar only) as UIElement. Only the
      # fresh build has the setting. How the Dock and the menu bar LOOK needs a real Mac.
      - name: Show in Dock
        if: matrix.source == 'build'
        run: |
          app="$RUNNER_TEMP/Claude Swap.app"
          bin="$app/Contents/MacOS/Claude Swap"
          export CSWAP_DESKTOP_BIN="$GITHUB_WORKSPACE/test/fake-cswap/fake-cswap.mjs"
          export FAKE_CSWAP_STATE="$RUNNER_TEMP/fake-cswap-state.json"
          app_type() {
            local asn
            asn=$(lsappinfo find "pid=$1")
            [ -n "$asn" ] && lsappinfo info -only ApplicationType "$asn"
          }
          # expect <pid> <label> <type>: waits up to 15 s for macOS to report <type>, and
          # checks it is still that 3 s later (not a passing state on the way to another)
          expect() {
            local got=""
            for _ in $(seq 30); do
              got=$(app_type "$1")
              case "$got" in *"\"$3\""*)
                sleep 3
                got=$(app_type "$1")
                case "$got" in *"\"$3\""*) echo "$2: $got"; return 0 ;; esac
                break ;;
              esac
              sleep 0.5
            done
            echo "::error::$2: expected $3, lsappinfo said: ${got:-nothing}"
            return 1
          }
          # start <mode> <startMinimized>: a fresh data dir whose settings.json has the mode
          start() {
            export CSWAP_DESKTOP_USERDATA="$RUNNER_TEMP/dock-$1"
            mkdir -p "$CSWAP_DESKTOP_USERDATA"
            printf '{"dockIcon":"%s","startMinimized":%s,"autoUpdate":false}' "$1" "$2" \
              > "$CSWAP_DESKTOP_USERDATA/settings.json"
            "$bin" > "$RUNNER_TEMP/dock-$1.log" 2>&1 &
            pid=$!
            sleep 3
          }
          stop() { kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null || true; }
          ok=yes

          start never false
          expect "$pid" "never" UIElement || ok=no
          stop

          start always false
          expect "$pid" "always" Foreground || ok=no
          stop

          # whileWindowOpen, changed at runtime: started in the menu bar (no window), then a
          # second launch asks the running copy for its window, which brings the Dock icon.
          start whileWindowOpen true
          expect "$pid" "whileWindowOpen, window closed" UIElement || ok=no
          "$bin" >> "$RUNNER_TEMP/dock-whileWindowOpen.log" 2>&1 || true
          expect "$pid" "whileWindowOpen, window shown" Foreground || ok=no
          stop

          if [ $ok = no ]; then
            tail -n 20 "$RUNNER_TEMP"/dock-*.log
            exit 1
          fi

      - name: Verdict
        run: |
          echo "signature valid: ${{ steps.sig.outputs.valid }}, still running after 20s: ${{ steps.launch.outputs.running }}"
          # A fresh build must be launchable; the published release is only reported.
          if [ "${{ matrix.source }}" = build ]; then
            [ "${{ steps.sig.outputs.valid }}" = yes ] && [ "${{ steps.launch.outputs.running }}" = yes ]
          fi
