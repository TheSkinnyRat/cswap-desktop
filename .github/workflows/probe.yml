name: renderer probe (TEMPORARY, removed in the next commit)
on: { push: { branches: [v1-platform] } }
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release -p cswap-desktop --features cswap-desktop/stub-driver
      - shell: pwsh
        run: |
          $env:CSWAP_DESKTOP_USERDATA = "$env:RUNNER_TEMP\probe"
          $p = Start-Process target\release\claude-swap.exe -PassThru; Start-Sleep 10
          "alive=$(-not $p.HasExited)"; if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content "$env:RUNNER_TEMP\probe\claude-swap.log"
